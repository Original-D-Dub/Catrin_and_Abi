<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2108 1908" width="2108" height="1908">
  <defs>
    <linearGradient id="deck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1ebe3"/><stop offset="1" stop-color="#e3dace"/>
    </linearGradient>
    <linearGradient id="lip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ddd4c7"/><stop offset="1" stop-color="#b3a896"/>
    </linearGradient>
    <linearGradient id="drawerBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d4349"/><stop offset="1" stop-color="#23272b"/>
    </linearGradient>
    <linearGradient id="drawerFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e3337"/><stop offset="1" stop-color="#25292d"/>
    </linearGradient>
    <radialGradient id="lock" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#f2f3f4"/><stop offset="0.6" stop-color="#b9bcbf"/><stop offset="1" stop-color="#7d8185"/>
