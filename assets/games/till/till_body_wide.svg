    <linearGradient id="darkBox" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#50565b"/><stop offset="1" stop-color="#2d3135"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9d9d6"/><stop offset="0.15" stop-color="#fbfbf9"/>
      <stop offset="0.85" stop-color="#f4f4f2"/><stop offset="1" stop-color="#cfcfcc"/>
    </linearGradient>
    <linearGradient id="lcd" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8eab97"/><stop offset="0.25" stop-color="#9dbca7"/><stop offset="1" stop-color="#93b39d"/>
    </linearGradient>
  </defs>

