name: catrin_abi_bsl
description: "BSL Learning Game for Children - Learn British Sign Language with Catrin & Abi"
publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: ^3.10.7

dependencies:
  supabase_flutter: ^2.8.0
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  provider: ^6.1.1

  # Animations
  confetti: ^0.8.0
  flip_card: ^0.7.0

  # Local storage for preferences
  shared_preferences: ^2.2.2

  # SVG rendering
  flutter_svg: ^2.0.10

  # Game engine for Letter Quest RPG game
  flame: ^1.23.0
  flame_audio: ^2.10.4
  flame_svg: ^1.10.0

  # Rive animation runtime (files to be provided separately)
  rive: ^0.14.4

  # Direct vibration API for reliable haptic feedback on Android tablets
  vibration: ^3.1.3

  # Video playback for BSL colour videos in the colouring game
  video_player: ^2.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    # Success screen images
    - assets/success/

    # Logos
    - assets/logos/english/
    - assets/logos/welsh/

    # Characters
    - assets/characters/
    - assets/characters/abi/
    - assets/characters/catrin/
    - assets/characters/pero/
    - assets/characters/Gary/

    # BSL Alphabet (for card game)
    - assets/bsl_alphabet/
    - assets/bsl_alphabet_svg/
    - assets/wyddor_iac_svg/

    # Backgrounds
    - assets/backgrounds/

    # Home screen game tile images
    - assets/images/home_screen/

    # Rive animation assets
    - assets/hand_palm.riv
    - assets/pointer.riv
    - assets/catrin-wave.riv
    - assets/choose_a_game.riv

    # BSL colour videos for the colouring game
    - assets/colours_video/

    # Game-specific assets
    - assets/games/bubble_pop/
    - assets/games/ear_game/
    - assets/games/colouring/
    - assets/games/card_matching/
    - assets/games/vowel_hand/
    - assets/games/my_special_dog/
    - assets/games/letter_quest/
    - assets/games/letter_quest/catrin-bedroom/
    - assets/games/letter_quest/abi-bedroom/
    - assets/games/letter_quest/bathroom/
    - assets/games/letter_quest/mum-dad-bedroom/
    - assets/games/letter_quest/bungalow/bathroom/
    - assets/images/make10_number_line/
    - assets/games/bsl_sprint/

    # BSL number signs (for maths game)
    - assets/bsl_numbers/

    #Counting Game
    - assets/audio/counting_game/

    # Letter Quest RPG game audio
    - assets/audio/letter_quest/

    # Bubble Pop game audio
    - assets/audio/bubble_pop/

    # My Special Dog word audio
    - assets/audio/my_special_dog/

    # Number Line game audio
    - assets/audio/number_line/

    # Speech audio files
    - assets/audio/speech files/
    - assets/audio/speech files/alphabet_english/

    # Number Race map
    - assets/images/number_race/

    # Bingo assets
    - assets/images/animals/
    
    # Word thumbnails for vowel words game (3-letter CVC words)
    - assets/images/word_thumbnails/a/
    - assets/images/word_thumbnails/e/
    - assets/images/word_thumbnails/i/
    - assets/images/word_thumbnails/o/
    - assets/images/word_thumbnails/u/

    # Character Identification game data
    - assets/data/
    - assets/images/character_parts/
    - assets/images/colours_BSL/
    - assets/images/clothes-svg/
    - assets/images/clothes_line_video/

  fonts:
    - family: ComicRelief
      fonts:
        - asset: assets/fonts/ComicRelief-Regular.ttf
        - asset: assets/fonts/ComicRelief-Bold.ttf
          weight: 700
    - family: LuckiestGuy
      fonts:
        - asset: assets/fonts/LuckiestGuy-Regular.ttf
