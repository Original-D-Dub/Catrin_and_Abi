name: catrin_abi_bsl
description: "BSL Learning Game for Children - Learn British Sign Language with Catrin & Abi"
publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: ^3.10.7

dependencies:
  supabase_flutter: ^2.8.0
  flutter:
    sdk: flutter

  cupertino_icons: ^2.0.0

  # State management
  provider: ^6.1.1

  # Animations
  confetti: ^0.8.0
  flip_card: ^0.7.0

  # Local storage for preferences
  shared_preferences: ^2.2.2

  # SVG rendering
  flutter_svg: ^2.0.10
  path_drawing: ^1.0.1

  # Game engine for Letter Quest RPG game
  flame: ^1.23.0
  flame_audio: ^2.10.4
  flame_svg: ^2.0.0

  # Rive animation runtime (files to be provided separately)
  rive: ^0.14.4

  # Direct vibration API for reliable haptic feedback on Android tablets
  vibration: ^3.1.3

  # Video playback for BSL colour videos in the colouring game
  video_player: ^2.9.2

  # Disk caching for BSL colour videos streamed from Supabase Storage, so
  # they play back locally after the first download.
  flutter_cache_manager: ^3.4.1

  # Keychain/Keystore-backed storage for the Supabase auth session
  flutter_secure_storage: ^11.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    # Shared UI icons
    - assets/icons/

    # Success screen images
    - assets/success/

    # Logos
    - assets/logos/
    - assets/logos/english/
    - assets/logos/welsh/

    # Characters
    - assets/characters/
    - assets/characters/abi/
    - assets/characters/catrin/
    - assets/characters/pero/
    - assets/characters/Gary/

    # Sign alphabet, BSL & IAC (single letters + Welsh digraphs)
    - assets/bsl_alphabet_png/

    # Backgrounds
    - assets/backgrounds/

    # Home screen game tile images
    - assets/images/button fuzz.png
    - assets/images/champion-rosette.png
    - assets/images/home_screen/
    - assets/images/counting_game/
    - assets/images/counting_game/balloons/
    - assets/images/counting_game/candles/
    - assets/images/counting_game/hats/
    - assets/images/counting_game/strawberries/
    - assets/images/counting_game/oranges/
    - assets/images/counting_game/sandwiches/

    # Rive animation assets
    - assets/hand_palm.riv
    - assets/pointer.riv
    - assets/catrin-wave.riv
    - assets/choose_a_game.riv

    # Note: BSL colour videos formerly at assets/colours_video/ and
    # assets/colours_video2/ now live in the "game-videos" Supabase Storage
    # bucket and are fetched/cached at runtime by VideoAssetService.

    # Game-specific assets
    - assets/games/bubble_pop/
    - assets/games/colouring/
    - assets/games/card_matching/
    - assets/games/vowel_hand/
    - assets/games/letter_quest/
    - assets/games/letter_quest/catrin-bedroom/
    - assets/games/letter_quest/abi-bedroom/
    - assets/games/letter_quest/bathroom/
    - assets/games/letter_quest/mum-dad-bedroom/
    - assets/games/letter_quest/bungalow/bedroom/
    - assets/games/letter_quest/bungalow/bathroom/
    - assets/games/letter_quest/bungalow/kitchen/
    - assets/games/letter_quest/bungalow/garden/
    - assets/games/letter_quest/bungalow/livingroom/
    - assets/images/make10_number_line/
    - assets/games/bsl_sprint/
    - assets/games/bubble_shooter/background/
    - assets/games/bsl_number_builder/all/
    - assets/games/bsl_number_builder/english/
    - assets/games/bsl_number_builder/cymraeg/
    - assets/games/bsl_sprint/Abi/
    - assets/games/bsl_sprint/Catrin/
    - assets/games/bsl_sprint/Harley/
    - assets/games/bsl_sprint/JamJam/
    - assets/games/bsl_sprint/Osian/
    - assets/games/bsl_sprint/Ruby/
    - assets/games/bsl_sprint/Ryan/
    - assets/games/character_id/bodies/
    - assets/games/character_id/clothes/
    - assets/games/zoo/
    - assets/games/zoo/videos/
    - assets/games/zoo/photos/
    - assets/images/characters/
    - assets/games/till/
    - assets/games/till/signs/

    # BSL number signs (for maths game)
    - assets/bsl_numbers_png/

    #Counting Game
    - assets/audio/counting_game/

    # Letter Quest RPG game audio
    - assets/audio/letter_quest/

    # Bubble Pop game audio
    - assets/audio/bubble_pop/

    # Word audio for vowel_hand's multi-vowel word levels
    - assets/audio/vowel_hand/

    # Number Line game audio
    - assets/audio/number_line/

    # Sudoku How to Play audio
    - assets/audio/sudoku/

    # Zoo game audio
    - assets/audio/zoo/
    - assets/audio/till/

    # Letter Bingo reward-animal name audio
    - assets/audio/bingo/animals/

    # Speech audio files
    - assets/audio/speech files/
    - assets/audio/speech files/alphabet_english/

    # Welsh (Molly) speech audio files
    - assets/audio/speech_files_molly_cy/
    - assets/audio/speech_files_molly_cy/alphabet_welsh/

    # Number Race map
    - assets/images/number_race/

    # Word thumbnails for vowel words game (3-letter CVC words)
    - assets/images/word_thumbnails/a/
    - assets/images/word_thumbnails/e/
    - assets/images/word_thumbnails/i/
    - assets/images/word_thumbnails/o/
    - assets/images/word_thumbnails/u/

    # Character Identification game data
    - assets/data/
    - assets/images/character_parts/
    - assets/images/colours_BSL/
    - assets/images/clothes-svg/
    - assets/images/clothes_line_video/

  fonts:
    - family: ComicRelief
      fonts:
        - asset: assets/fonts/ComicRelief-Regular.ttf
        - asset: assets/fonts/ComicRelief-Bold.ttf
          weight: 700
    - family: OpenDyslexic
      fonts:
        - asset: assets/fonts/OpenDyslexic-Regular.otf
        - asset: assets/fonts/OpenDyslexic-Bold.otf
          weight: 700
    - family: LuckiestGuy
      fonts:
        - asset: assets/fonts/LuckiestGuy-Regular.ttf
    - family: Quicksand
      fonts:
        - asset: assets/fonts/Quicksand-VariableFont_wght.ttf
